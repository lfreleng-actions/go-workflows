---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Exercises the reusable Go workflows in this repository against
# downstream fixture repositories, in parallel, to prove the pipeline
# (job graph, harden-runner wiring, dual checkout, Go build/test/audit
# actions, SBOM/Grype chain) functions end-to-end.
#
# The reusable workflows are referenced with the self-repository form
# ('$/'), which resolves this repository at the commit already
# running. The workflows under test are therefore always the ones this
# branch defines, independently of what any checkout puts in the
# workspace.
#
# The build-test-release workflow is NOT self-tested here: it requires
# a signed semver tag-push context (and creates/promotes GitHub
# releases), which is neither available nor safe on a pull request.
# Instantiating repos validate it through their own release cycles.
#
# The change-scoped Grype gate lane lives in testing-gate.yaml, in its
# own run: it calls the same workflow against the same fixture, and
# upload-artifact rejects a second artefact of a name already uploaded
# in a run. The wiring itself (inputs, pins, checkout depth, sidecar
# transport and gerrit-validate rejections) is checked statically by
# tests/test-grype-gating.sh in the grype-gating-checks job below.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Fixture repositories fanned out in parallel via a matrix; each leg
  # pins a known ref so results stay reproducible.
  build-test:
    name: 'Build/Test (${{ matrix.name }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'test-go-project'
            repository: 'lfreleng-actions/test-go-project'
            ref: '02a24ba15c4687eb443bf407b5fc0b4d099ab86f' # v0.1.0
            path_prefix: '.'
            build_target: './...'
            go_version_matrix: ''
            test_permit_fail: false
            audit_permit_fail: false
            grype_permit_fail: false
            gosec: false
            staticcheck: false
            lint_permit_fail: false
          # go.mod declares Go 1.16 (too old to detect a matrix from),
          # so the leg pins the matrix to Go 1.26.
          - name: 'multicloud-k8s'
            repository: 'onap/multicloud-k8s'
            ref: '5c3b1a96811024e65b0977305b6d6737a6e2d453'
            path_prefix: 'src/k8splugin'
            # The tree carries Go plugin sources (package main without
            # func main) that break a plain ./... build; compile the
            # CLI entry point and libraries instead. Multiple packages
            # make go build discard outputs, avoiding a name collision
            # between the cmd binary and the cmd directory.
            build_target: './cmd ./internal/...'
            go_version_matrix: '["1.26"]'
            # Env-dependent test failure in internal/app at this pin
            test_permit_fail: true
            # gosec 38 / staticcheck 18 findings at this pin
            audit_permit_fail: true
            # The 2021-era dependency tree carries medium+ CVEs
            grype_permit_fail: true
            gosec: true
            staticcheck: true
            lint_permit_fail: true
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      path_prefix: ${{ matrix.path_prefix }}
      build_target: ${{ matrix.build_target }}
      go_version_matrix: ${{ matrix.go_version_matrix }}
      test_permit_fail: ${{ matrix.test_permit_fail }}
      audit_permit_fail: ${{ matrix.audit_permit_fail }}
      grype_permit_fail: ${{ matrix.grype_permit_fail }}
      gosec: ${{ matrix.gosec }}
      staticcheck: ${{ matrix.staticcheck }}
      lint_permit_fail: ${{ matrix.lint_permit_fail }}
      # Each leg calls build-test in the same run; without a distinct
      # suffix the legs share artefact names and upload-artifact
      # rejects the second upload of a name. The Grype job binds to
      # its own SBOM by artefact ID regardless.
      artifact_suffix: ${{ matrix.name }}
      # Exercise the allow-list inputs without granting anything new.
      # A same-organisation list may follow its default branch, and
      # 'lfreleng-actions//' resolves to the organisation list itself,
      # which de-duplication absorbs. The organisation list already
      # carries github.com:443, so the action reports it as redundant.
      harden_runner_supplemental_allowlist: 'lfreleng-actions//'
      harden_runner_supplemental_unpinned: true
      harden_runner_extra_endpoints: 'github.com:443'

  # Static checks on the gating wiring, including the fetch-depth the
  # detection step needs and the gerrit-validate rejection of each
  # invalid policy value, and on the per-leg artefact suffix and the
  # by-ID SBOM download that keep each leg's Grype job on its own
  # SBOM, run from the workflows this branch defines.
  grype-gating-checks:
    name: 'Grype Gating Wiring'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Check the Grype gating wiring'
        shell: bash
        env:
          VENV: ${{ runner.temp }}/grype-gating-venv
        run: |
          # The script parses with 'python3 -I', which ignores the user
          # site, so a user-site install would not reach it. A virtual
          # environment on PATH does: '-I' keeps the interpreter's own
          # prefix, and the script resolves python3 through PATH.
          python3 -m venv "${VENV}"
          "${VENV}/bin/python" -m pip install --quiet 'pyyaml==6.0.2'
          PATH="${VENV}/bin:${PATH}" bash tests/test-grype-gating.sh

      - name: 'Check the artefact suffix wiring'
        shell: bash
        env:
          VENV: ${{ runner.temp }}/grype-gating-venv
        run: |
          # Each matrix leg must name its SBOM, Grype, CBOM and test
          # artefacts apart, and each Grype job must download the SBOM
          # its own sbom job uploaded, by artefact ID; reuses the
          # virtual environment set up above
          PATH="${VENV}/bin:${PATH}" bash tests/test-artifact-suffix.sh
